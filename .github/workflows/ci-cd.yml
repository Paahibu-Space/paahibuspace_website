name: Laravel CI/CD

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Tests (Unit & Feature)
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_db
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan test

  deploy:
    name: Build & Deploy
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    concurrency:
      group: deploy-websiteapi-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: 🔍 Set Deployment Config
        id: deploy-config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=Production" >> "$GITHUB_OUTPUT"
            echo "deploy_path=/home/sites/23a/4/4bebba9906/websiteapi" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=Staging" >> "$GITHUB_OUTPUT"
            echo "deploy_path=/home/sites/23a/4/4bebba9906/websiteapi-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛑 Validate Deployment Path
        run: |
          DEPLOY_PATH="${{ steps.deploy-config.outputs.deploy_path }}"
          if [[ -z "$DEPLOY_PATH" || "$DEPLOY_PATH" != /home/sites/* ]]; then
            echo "Refusing to deploy: deploy_path '$DEPLOY_PATH' is empty or unexpected."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: 🔑 Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Sync Files (Rsync)
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='.editorconfig' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='public/storage' \
            --exclude='public/assets/uploads/media-uploader' \
            --exclude='public/assets/uploads/annual-reports' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ steps.deploy-config.outputs.deploy_path }}

      - name: 🚀 Run Post-Deployment Commands
        run: |
          DEPLOY_PATH="${{ steps.deploy-config.outputs.deploy_path }}"
          ssh -T ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash ${DEPLOY_PATH}/scripts/deploy.sh ${DEPLOY_PATH}"
