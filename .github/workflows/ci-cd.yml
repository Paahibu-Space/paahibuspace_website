name: Laravel CI/CD

on:
  push:
    branches: [ "main", "api" ]
  pull_request:
    branches: [ "main", "api" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Tests (Unit & Feature)
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_db
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan test

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/api'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy via SSH
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_BRANCH
          script: |
            set -e
            # 1. Force the shell to load the environment paths
            export PATH=/usr/local/bin:/usr/bin:/bin:/usr/php82/usr/bin:$PATH

            # 2. Ensure directory exists and is a git repository
            mkdir -p /home/sites/23a/4/4bebba9906/websiteapi
            cd /home/sites/23a/4/4bebba9906/websiteapi

            if [ ! -d .git ]; then
                git init
                git remote add origin https://github.com/Paahibu-Space/paahibuspace_website.git
            fi

            # 3. Ensure .env exists (Important for fresh folders)
            if [ ! -f .env ]; then
                cp .env.example .env
                echo ".env created from .env.example. PLEASE UPDATE SECRETS MANUALLY."
            fi

            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            composer install --no-dev --optimize-autoloader
            npm ci
            npm run build

            # 3. Use 'command -v' to find wherever php82 or php is hiding
            PHP_BIN=$(command -v php82 || command -v php)

            # 4. Run the commands using that discovered binary
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan storage:link
